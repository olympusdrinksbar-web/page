# Configuración de Netlify para Olympus Drinks Bar
# Sitio estático: no necesita comando de compilación.

[build]
  publish = "."
  command = ""

# Encabezados de seguridad para todas las páginas
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Imágenes y fuentes: caché de 7 días (si reemplazas una imagen con el mismo nombre, se actualiza a más tardar en una semana)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# CSS y JS: el navegador revisa si hay cambios en cada visita (así los cambios de precios se ven al instante)
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
